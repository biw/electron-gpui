[workspace]
resolver = "2"
members = ["crates/*", "examples/*/native"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/biw/electron-gpui"
publish = false

[workspace.dependencies]
electron-gpui = { path = "crates/electron-gpui" }
# GPUI from Zed plus our embedded-platform patches, on the
# electron-gpui-embedded-cross-platform branch of https://github.com/biw/zed. See CONTRIBUTING.md.
gpui = { git = "https://github.com/biw/zed", rev = "2d06d4aa370a12d029c12a04185c710a7586d553", default-features = false, features = [
  "font-kit",
] }
gpui_macos = { git = "https://github.com/biw/zed", rev = "2d06d4aa370a12d029c12a04185c710a7586d553", features = [
  "font-kit",
] }
gpui_windows = { git = "https://github.com/biw/zed", rev = "2d06d4aa370a12d029c12a04185c710a7586d553", default-features = false }
gpui_linux = { git = "https://github.com/biw/zed", rev = "2d06d4aa370a12d029c12a04185c710a7586d553", features = [
  "x11",
  "wayland",
] }
napi = { version = "3", default-features = false, features = ["napi6", "dyn-symbols"] }
napi-derive = "3"
napi-build = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
subsecond = "0.7.10"

[profile.dev]
# Keep target/ small: GPUI pulls in a lot of crates.
debug = 0
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
