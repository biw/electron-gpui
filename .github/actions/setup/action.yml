name: Setup
description: Install Node, pnpm and Rust.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: pnpm
    - name: Linux build and display dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang cmake pkg-config libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libglib2.0-dev libssl-dev libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri xvfb openbox weston libweston-13-dev x11-utils dbus-x11
      shell: bash
    - name: Windows compiler environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
    - run: pnpm install --frozen-lockfile
      shell: bash
    - name: Install Rust toolchain (rust-toolchain.toml)
      run: rustup toolchain install
      shell: bash
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
