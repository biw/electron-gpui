name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  ELECTRON_GPUI_NO_SWEEP: "1"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: node scripts/check-consistency.mjs
      - run: pnpm lint
      - run: pnpm test
      - name: Native release build
        run: cargo build --workspace --release --locked
      - name: Scaffold and build a standalone views crate
        run: node scripts/scaffold-smoke.mjs

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources

  smoke:
    name: Smoke (${{ matrix.platform.os }}, ${{ matrix.platform.display }}, Electron ${{ matrix.electron }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        electron: ["30", "latest"]
        platform:
          - { os: macos-15, display: native }
          - { os: macos-15-intel, display: native }
          - { os: windows-2025, display: native }
          - { os: ubuntu-24.04, display: x11 }
          - { os: ubuntu-24.04, display: wayland }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Use Electron ${{ matrix.electron }}
        run: pnpm --filter counter-example add --save-dev electron@${{ matrix.electron }}
      - run: pnpm build
      - name: Native window smoke test
        run: pnpm exec node scripts/ci-smoke.mjs ${{ matrix.platform.display }} smoke
      - name: Hot reload smoke test
        if: matrix.electron == 'latest'
        run: pnpm exec node scripts/ci-smoke.mjs ${{ matrix.platform.display }} smoke:hot
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.platform.os }}-${{ matrix.platform.display }}-${{ matrix.electron }}
          path: .context/*.log
